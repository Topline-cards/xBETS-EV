name: Update picks

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 min; the script only pulls odds within 4h of a kickoff
  workflow_dispatch:
    inputs:
      force:
        description: "Pull odds now, even if no game is close"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write          # lets the game-day loop start its own next run

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # game-day loop runs for hours; hands off before GitHub's 6h limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build picks (loops on game days)
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "xbets-bot"
          git config user.email "xbets-bot@users.noreply.github.com"
          python -m pipeline.loop ${{ inputs.force && '--force' || '' }}
