name: Update picks

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 min; the script only pulls odds within 4h of a kickoff
  workflow_dispatch:
    inputs:
      force:
        description: "Pull odds now, even if no game is close"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build picks
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
        run: python -m pipeline.build ${{ inputs.force && '--force' || '' }}
      - name: Save results
        run: |
          git config user.name "xbets-bot"
          git config user.email "xbets-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
