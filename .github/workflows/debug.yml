name: Debug feeds

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only probe SharpAPI options (no PinnWire calls)"
        type: boolean
        default: false
      nba:
        description: "Probe NBA feeds"
        type: boolean
        default: false
      module:
        description: "Run this pipeline module instead (e.g. probe_books)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sample each odds API
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SKIP_SHARP: ${{ inputs.nba && '1' || '' }}
        run: python -m pipeline.${{ inputs.module != '' && inputs.module || (inputs.nba && 'probe_nba' || (inputs.probe && 'probe_sharp' || 'debug_feeds')) }}
      - name: Save sample
        run: |
          git config user.name "xbets-bot"
          git config user.email "xbets-bot@users.noreply.github.com"
          git add docs/data/debug.json docs/data/probe.json docs/data/probe_nba.json docs/data/probe_books.json docs/data/probe_td.json docs/data/nba/probe_pos.json docs/data/probe_cbb.json docs/data/cbb_check.json docs/data/cbb/model_check.json docs/data/cbb/cache docs/data/nba/positions_*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Debug feed sample"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
