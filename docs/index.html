<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>xBETS · NFL</title>
<style>
  :root{
    --bg:#14151b; --panel:#1d1f27; --panel2:#252833; --line:#2f3240;
    --text:#eceef4; --dim:#9298a8; --dimmer:#646a7a;
    --cyan:#4fd1e8; --green:#3ecf8e; --red:#ef6b6b; --amber:#f0b54a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body.lock{overflow:hidden}
  header{position:sticky;top:0;z-index:10;background:rgba(20,21,27,.96);
    backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 14px 0;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:19px;margin:0;letter-spacing:.02em}
  h1 b{color:var(--cyan)}
  .meta{font-size:12px;color:var(--dim);text-align:right}
  .tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:0;background:none;color:var(--dim);font:600 14px/1 inherit;
    padding:10px 9px 12px;border-bottom:2px solid transparent;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--cyan)}
  .tab .n{font-weight:500;color:var(--dimmer);margin-left:4px;font-size:12px}
  main{padding:12px 12px calc(env(safe-area-inset-bottom) + 40px);max-width:720px;margin:0 auto}
  .banner{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:13px;color:var(--dim);margin-bottom:10px}
  .banner b{color:var(--text)}
  .banner.warn{border-color:#5a4720;color:#e6cf9c}
  .filters{display:grid;grid-template-columns:1.3fr 1.3fr 1fr;gap:6px;margin:0 0 12px}
  .sel{position:relative}
  .sel label{display:block;font-size:10.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.05em;margin:0 0 3px 2px}
  .sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:9px 26px 9px 10px;font:500 13.5px/1.2 inherit}
  .sel::after{content:"▾";position:absolute;right:10px;bottom:10px;color:var(--dim);pointer-events:none;font-size:12px}
  .sel select.on{border-color:var(--cyan)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
  .card:active{background:#22242d}
  .tc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 13px 6px;margin-bottom:10px;cursor:pointer}
  .tc:active{background:#22242d}
  .tc.snap{cursor:default}.tc.snap:active{background:var(--panel)}
  .tc.fav{border-color:#3b6b55}
  .th{display:flex;gap:11px;align-items:flex-start}
  .logo{width:44px;height:44px;border-radius:50%;background:#fff;flex:0 0 44px;object-fit:contain;padding:5px}
  .logo.txt{display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--dim);font:700 12px/1 inherit;padding:0}
  .tm{flex:1;min-width:0}
  .tn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tn .vs{font-weight:500;color:var(--dim);font-size:14px;margin-left:3px}
  .tb{font-size:16px;margin-top:1px}
  .tb .o{color:var(--green);font-weight:650} .tb .u{color:var(--red);font-weight:650}
  .tp{text-align:right;flex:0 0 auto}
  .tp .odds{font-size:18px}
  .bk{display:inline-block;margin-top:3px;font:800 10px/1 inherit;letter-spacing:.04em;padding:3px 5px;border-radius:4px;color:#fff}
  .bk.draftkings{background:#2c7a3f} .bk.fanduel{background:#1d6fd1} .bk.pinnacle{background:#c8102e}
  .tr{display:flex;align-items:center;gap:9px;padding:7px 1px;border-top:1px solid #262935;font-size:14.5px}
  .tr:first-of-type{margin-top:10px}
  .tr svg{flex:0 0 17px;width:17px;height:17px;fill:var(--dimmer)}
  .tr .tx{flex:1;color:#c9cdd8;min-width:0}
  .tr .pv{font-weight:650;font-variant-numeric:tabular-nums;color:var(--dim)}
  .tr .pv.hi{color:var(--green)} .tr .pv.lo{color:var(--red)}
  .tr.ev .tx b{color:var(--green)}
  .tr.urow{border-top:1px solid #2d3a33;background:linear-gradient(90deg,rgba(62,207,142,.08),transparent);margin:0 -13px;padding:9px 14px}
  .tr.urow .pv{color:var(--green);font-size:17px}
  .inj{display:inline-block;font-size:11px;font-weight:800;color:#2a1d05;background:var(--amber);border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:2px}
  .fav-b{display:inline-block;font-size:11px;font-weight:700;color:#0d2a1d;background:var(--green);border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:2px}
  .budget{color:var(--text)}
  .addbtn{display:block;width:calc(100% + 26px);margin:6px -13px -6px;border:0;border-top:1px solid #262935;background:none;
    color:var(--cyan);font:650 14px/1 inherit;padding:12px;border-radius:0 0 14px 14px;cursor:pointer}
  .addbtn.on{color:var(--green);background:rgba(62,207,142,.07)}
  .mb{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .mb .who{flex:1;min-width:0} .mb .who .name{white-space:normal;overflow:visible}
  .mb .res{font:700 12px/1 inherit;padding:4px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
  .res.win{background:#173627;color:var(--green)} .res.loss{background:#3a1b1b;color:var(--red)}
  .res.push,.res.void{background:var(--panel2);color:var(--dim)} .res.pending{background:#2a2412;color:var(--amber)}
  .pl-amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
  .more-btn{display:block;width:100%;margin:4px 0 10px;border:1px dashed var(--line);background:none;color:var(--dim);border-radius:10px;padding:11px;font:600 13px/1 inherit;cursor:pointer}
  .meter{height:6px;background:var(--panel2);border-radius:3px;margin-top:8px;overflow:hidden}
  .meter div{height:100%;background:var(--green)}
  .field{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px;color:var(--text)}
  .field input{flex:0 0 110px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font:600 17px/1 inherit}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:7px 12px;font:600 13px/1 inherit;cursor:pointer}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#071419}
  .tier{font-size:10px;font-weight:800;letter-spacing:.05em;border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:1px}
  .tier.prime{background:#173627;color:var(--green)} .tier.test{background:#2a2412;color:var(--amber)}
  .dv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums;margin:4px 0 6px}
  .dv .w{color:var(--amber);font-weight:700}
  .rg{font-size:12px;color:var(--dim);text-align:center;margin:18px 4px 8px;line-height:1.5}
  .rg a{color:var(--cyan)}
  .menu{border:0;background:none;color:var(--text);font-size:22px;line-height:1;padding:2px 10px 2px 0;cursor:pointer}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(290px,82vw);background:var(--bg);border-right:1px solid var(--line);
    z-index:31;transform:translateX(-102%);transition:transform .22s ease;padding:18px 14px;overflow-y:auto}
  .drawer.open{transform:none}
  .dshade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .dshade.open{opacity:1;pointer-events:auto}
  .drawer h4{margin:16px 4px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .sp{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:8px;color:var(--text);font:inherit;text-align:left;cursor:pointer;text-decoration:none}
  .sp.on{border-color:var(--cyan);background:rgba(73,212,232,.08)}
  .sp .em{font-size:24px} .sp b{display:block;font-size:16px} .sp .sub{margin:0}
  .sp .ck{margin-left:auto;color:var(--cyan);font-weight:700}
  .sporttag{font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-right:4px}
  .gear{border:1px solid #2b4a52;background:none;color:var(--cyan);border-radius:999px;padding:5px 9px;margin-left:6px;font-size:14px;cursor:pointer}
  .unitset{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;white-space:nowrap}
  .unitset input{width:62px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 6px;font:600 14px/1 inherit}
  .note-amber{color:var(--amber);font-size:12px}
  .toplink{display:inline-flex;align-items:center;gap:5px;color:var(--cyan);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid #2b4a52;border-radius:999px;padding:5px 10px;margin-left:8px}.card.snap:active{background:var(--panel)}
  .row{display:flex;align-items:center;gap:10px}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:0 0 42px;
    display:flex;align-items:center;justify-content:center;font:700 12px/1 inherit;color:var(--dim)}
  .who{flex:1;min-width:0}
  .name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--dim)}
  .units{text-align:right;flex:0 0 auto}
  .units .u{font:700 22px/1 inherit;color:var(--green)}
  .units .ul{font-size:11px;color:var(--dim);margin-top:3px}
  .prop{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    background:var(--panel2);border-radius:9px;padding:9px 11px;gap:8px}
  .prop .pl{font-weight:650}
  .side-over,.good{color:var(--green)} .side-under,.bad{color:var(--red)}
  .odds{font-weight:700;font-variant-numeric:tabular-nums}
  .book{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .stats.two{grid-template-columns:repeat(2,1fr)}
  .s{background:var(--bg);border-radius:8px;padding:7px 8px}
  .s .k{font-size:10.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.05em}
  .s .v{font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:10px;position:relative}
  .bar{flex:1;border-radius:3px 3px 0 0;min-height:2px}
  .lineMark{position:absolute;left:0;right:0;border-top:1px dashed var(--amber)}
  .barlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dimmer);margin-top:3px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--dim)}
  .more{color:var(--cyan);font-weight:600}
  .tag{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--amber);margin-left:4px}
  .empty{text-align:center;color:var(--dim);padding:30px 10px}
  .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--dimmer);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.tap{cursor:pointer} tr.tap:active{background:var(--panel2)}
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
  .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum h3{margin:0 0 6px;font-size:13px;color:var(--dim);font-weight:600}
  .sum .big{font:700 20px/1.1 inherit}
  .help{font-size:12.5px;color:var(--dim);line-height:1.5;margin:0 2px 10px}
  .help b{color:var(--text)}
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .shade.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow-y:auto;
    background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
    transform:translateY(100%);transition:transform .25s ease;padding:0 14px calc(env(safe-area-inset-bottom) + 24px);
    max-width:720px;margin:0 auto}
  .sheet.open{transform:none}
  .grab{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .grab .bar0{width:40px;height:4px;border-radius:2px;background:var(--line);position:absolute;left:50%;top:6px;transform:translateX(-50%)}
  .close{border:0;background:var(--panel2);color:var(--text);border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer;margin-left:auto}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .sec h3{margin:0 0 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .calc{font-size:13.5px;line-height:1.65}
  .calc .eq{font-variant-numeric:tabular-nums;color:var(--text);background:var(--bg);border-radius:7px;padding:6px 8px;margin:4px 0;display:block}
  .calc .note{color:var(--dim);font-size:12.5px}
  .bet{display:inline-block;margin-top:10px;background:var(--cyan);color:#071419;font-weight:700;border-radius:9px;padding:10px 14px;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div style="display:flex;align-items:center"><button class="menu" id="open-menu" aria-label="Sports menu">☰</button>
    <h1><b>xBETS</b> <span id="sport-name">NFL</span></h1></div>
    <div style="display:flex;align-items:center"><div class="meta" id="meta">Loading…</div>
<button class="gear" id="open-settings2" aria-label="Settings">⚙️</button></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-t="combined">EV + Cheat Sheet<span class="n" id="n-combined"></span></button>
    <button class="tab" data-t="ev">EV<span class="n" id="n-ev"></span></button>
    <button class="tab" data-t="mine">My Results<span class="n" id="n-mine"></span></button>
    <button class="tab" data-t="results">Record</button>
  </nav>
</header>
<main id="main"></main>
<div class="shade" id="shade"></div>
<div class="dshade" id="dshade"></div>
<nav class="drawer" id="drawer" aria-label="Sports"></nav>
<div class="sheet" id="sheet"></div>

<script>
const SPORTS = {
  nfl: {name:"NFL", em:"🏈", days:"Sundays + Thanksgiving", base:"data/", kick:"kickoff"},
  nba: {name:"NBA", em:"🏀", days:"Mon–Fri + Christmas", base:"data/nba/", kick:"tip-off"},
  cbb: {name:"CBB", em:"🎓", days:"Tue, Wed, Fri + Sat · ML, spread, total", base:"data/cbb/", kick:"tip-off"},
};
const SPORT_KEY = "xbets_sport";
const initialSport = (() => { const q = new URLSearchParams(location.search).get("sport");
  if (q && SPORTS[q]) return q; try { const v = localStorage.getItem(SPORT_KEY); if (SPORTS[v]) return v; } catch(e){} return "nfl"; })();
const S = {sport: initialSport, data:null, results:null, gradedBy:{}, tab:"combined", game:"all", type:"all", book:"all", shown:[], mShown:[], gmShown:[]};
const SP = () => SPORTS[S.sport];
const POS_NAME = {G:"guards", F:"forwards", C:"centers", PG:"point guards", SG:"shooting guards", SF:"small forwards", PF:"power forwards"};
const posName = p => POS_NAME[p] || (p ? p + "s" : "");
const logLbl = g => g.lbl || (g.season !== S.data.season ? g.season + " " : "") + "Wk " + g.wk;
const BOOK = {draftkings:"DraftKings", fanduel:"FanDuel", pinnacle:"Pinnacle"};
const KIND = {ml:"Moneyline", spread:"Spread", total:"Total"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const am = a => a == null ? "–" : a > 0 ? "+" + a : String(a);
const toAm = d => !d ? null : d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
const pct = (v, d=1) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
const p1 = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
const when = iso => { if(!iso) return ""; const d = new Date(iso);
  return d.toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}); };
const ago = iso => { if(!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : Math.round(m/1440) + "d ago"; };
const isProp = p => (p.kind || "prop") === "prop";
const sideWins = (p, v) => p.side === "over" ? v > p.line : v < p.line;

async function load(){
  const bust = "?t=" + Date.now();
  const base = SP().base;
  try { S.data = await (await fetch(base + "picks.json" + bust)).json(); } catch(e){ S.data = null; }
  try { S.results = await (await fetch(base + "results.json" + bust)).json(); } catch(e){ S.results = null; }
  await Promise.all(Object.entries(SPORTS).map(async ([k, v]) => {
    try { S.gradedBy[k] = await (await fetch(v.base + "graded.json" + bust)).json(); } catch(e){ S.gradedBy[k] = S.gradedBy[k] || {}; } }));
  render();
}

/* ---------------- filters ---------------- */
function matches(p){
  if (S.game !== "all" && p.game_id !== S.game) return false;
  if (S.book !== "all" && p.book !== S.book) return false;
  if (S.type === "all") return true;
  if (S.type === "props") return isProp(p);
  if (S.type === "lines") return !isProp(p);
  return (isProp(p) ? p.stat : p.kind) === S.type;
}
function filterBar(){
  const d = S.data;
  const gameOpts = [["all","All games"], ...(d.games || []).map(g => [g.game_id, `${g.label} · ${when(g.kickoff)}`])];
  const propStats = new Map();
  for (const k of ["combined","ev","cheat"]) for (const p of d[k] || []) if (isProp(p)) propStats.set(p.stat, p.stat_label);
  for (const r of d.matchups || []) propStats.set(r.stat, r.stat_label);
  const typeOpts = [["all","All bets"], ["lines","Game lines"], ["ml","· Moneyline"], ["spread","· Spread"], ["total","· Total (O/U)"],
    ["props","Player props"], ...[...propStats].map(([k,v]) => [k, "· " + v])];
  const bookOpts = [["all","All books"], ["draftkings","DraftKings"], ["fanduel","FanDuel"]];
  const sel = (id, label, opts, cur) => `<div class="sel"><label>${label}</label>
    <select id="${id}" class="${cur !== "all" ? "on" : ""}">${opts.map(([v,t]) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`;
  return `<div class="filters">${sel("f-game","Game",gameOpts,S.game)}${sel("f-type","Bet type",typeOpts,S.type)}${sel("f-book","Book",bookOpts,S.book)}</div>`;
}

/* ---------------- cards ---------------- */
function bars(p){
  const vals = p.last10 || []; if(!vals.length || !isProp(p) || p.line == null) return "";
  const max = Math.max(p.line * 1.4, ...vals, 1);
  const b = vals.map(v => `<div class="bar" style="height:${Math.max(v / max * 100, 4)}%;background:${sideWins(p, v) ? "var(--green)" : "#4a4f60"}"></div>`).join("");
  const hits = vals.filter(v => sideWins(p, v)).length;
  return `<div class="bars">${b}<div class="lineMark" style="bottom:${Math.min(p.line / max * 100, 100)}%"></div></div>
    <div class="barlbl"><span>Last ${vals.length} games</span><span>Hit ${p.side} ${p.line} in ${hits}/${vals.length}</span></div>`;
}
const box = (k, v, cls="") => `<div class="s"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
const gc = ok => ok ? "good" : "bad";

const ICON = {
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',

};
const PREF_KEY = "xbets_prefs", UNIT_KEY = "xbets_unit_usd", MY_KEY = "xbets_mybets";
const myBets = () => { try { return JSON.parse(localStorage.getItem(MY_KEY) || "[]"); } catch(e){ return []; } };
const saveMyBets = a => { try { localStorage.setItem(MY_KEY, JSON.stringify(a)); } catch(e){} };
const betKey = p => `${p.week}|${p.pkey}|${p.stat}|${p.side}|${p.line}`;
const isMine = p => myBets().some(b => b.key === betKey(p) && b.book === p.book && (b.sport || "nfl") === S.sport);
const gradeOf = b => (S.gradedBy[b.sport || "nfl"] || {})[b.key] || null;
function toggleMine(p){
  const a = myBets(), i = a.findIndex(b => b.key === betKey(p) && b.book === p.book && (b.sport || "nfl") === S.sport);
  if (i >= 0) a.splice(i, 1);
  else a.push({id: Date.now(), sport: S.sport, key: betKey(p), season: S.data.season, week: p.week, player: p.player, title: p.title,
    stat_label: p.stat_label, kind: p.kind || "prop", book: p.book, american: p.american, dec: p.dec,
    units: p.units || 0, stake: p.units && unitUsd() ? +(p.units * unitUsd()).toFixed(2) : null,
    kickoff: p.kickoff, team: p.team, opp: p.opp, ev_pct: p.ev_pct, added_at: new Date().toISOString()});
  saveMyBets(a);
}
const BUDGET_KEY = "xbets_budget_units";
const getNum = k => { try { return parseFloat(localStorage.getItem(k)) || 0; } catch(e){ return 0; } };
const setNum = (k, v) => { try { v ? localStorage.setItem(k, String(v)) : localStorage.removeItem(k); } catch(e){} };
const unitUsd = () => getNum(UNIT_KEY) || (S.data && S.data.settings && S.data.settings.unit_usd) || 0;
function applyBudget(list, mode){ return list; }   // no budget cap: every +EV play is sized, none voided
const usd = u => { const d = unitUsd(); if (!d || !u) return ""; const v = u * d; return "$" + (Number.isInteger(v) ? v : v.toFixed(2)); };
const prefs = () => { try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); } catch(e){ return {}; } };
const prefOf = p => p && p.pkey ? (prefs()[p.pkey] || {}).v : null;
const pctCls = v => v == null ? "" : v >= 0.6 ? "hi" : v <= 0.4 ? "lo" : "";
const shortName = n => { const a = String(n || "").split(" "); return a.length > 1 && a[0].length > 2 ? a[0][0] + ". " + a.slice(1).join(" ") : n; };
const STAT_SHORT = {pts:"Points", reb:"Rebounds", ast:"Assists", fg3:"3-Pointers", pra:"Pts+Reb+Ast", anytime_td:"Anytime TD", pass_tds:"Pass TDs", pass_yds:"Pass Yds", pass_comp:"Pass Compl", pass_att:"Pass Att", rush_yds:"Rush Yds", rush_att:"Rush Att", rec_yds:"Rec Yds", receptions:"Receptions"};

function trow(icon, text, val, cls="", rowCls=""){
  return `<div class="tr ${rowCls}">${ICON[icon]}<div class="tx">${text}</div><div class="pv ${cls}">${val ?? ""}</div></div>`;
}
function hitRow(icon, label, vals, p){
  if (!vals || !vals.length || p.line == null) return "";
  const h = vals.filter(v => sideWins(p, v)).length, r = h / vals.length;
  return trow(icon, `Hit in ${h} of last ${vals.length} ${label}`, Math.round(r * 100) + "%", pctCls(r));
}
function logoImg(team){
  const u = team && S.data.logos ? S.data.logos[team] : null;
  const txt = `<div class="logo txt">${esc(team || SP().name)}</div>`;
  return u ? `<img class="logo" src="${esc(u)}" alt="${esc(team)}" loading="lazy" onerror="this.outerHTML='${txt.replace(/"/g, "&quot;")}'">` : txt;
}

function card(p, mode, i, inDetail){
  const prop = isProp(p);
  const fav = prefOf(p) === "up";
  const rows = [];
  let name, bet, team;
  if (prop) {
    team = p.team;
    name = `${esc(shortName(p.player))}<span class="vs">${p.opp ? (p.home_away === "away" ? "@ " : "vs ") + esc(p.opp) : ""}</span>`;
    bet = p.stat === "anytime_td"
      ? `<span class="${p.side === "over" ? "o" : "u"}">${p.side === "over" ? "Yes" : "No"}</span> Anytime TD`
      : `<span class="${p.side === "over" ? "o" : "u"}">${p.side === "over" ? "Over" : "Under"} ${p.line}</span> ${esc(STAT_SHORT[p.stat] || p.stat_label)}`;
    rows.push(hitRow("bolt", "games", p.last10, p));
    rows.push(hitRow("shield", `games vs ${esc(p.opp)}`, (p.vs_opp || []).map(g => g.v), p));
    if (p.home_away) rows.push(hitRow("pin", `${p.home_away} games`, (p.log || []).filter(g => g.ha === p.home_away).map(g => g.v), p));
    if (p.matchup_pct != null) {
      const good = (p.side === "over") === (p.matchup_pct > 0);
      rows.push(trow("target", `${esc(p.opp)} allows ${pct(p.matchup_pct, 0)} to ${esc(posName(p.position))} · rank ${p.def_rank}/${p.def_n || 32}`,
        good ? "✓" : "✗", good ? "hi" : "lo"));
    }
    if (p.projection != null) rows.push(trow("chart", `Projection ${p.projection} vs line ${p.line}`, pct(p.proj_edge_pct, 0),
        (p.side === "over") === (p.proj_edge_pct > 0) ? "hi" : "lo"));
  } else {
    const m = p.game_model || {};
    team = p.team || m.home;
    name = p.kind === "total" ? `${esc(m.away)} @ ${esc(m.home)}` : `${esc(p.team)}<span class="vs">${p.side === "home" ? "vs " : "@ "}${esc(p.opp)}</span>`;
    const side = p.side === "over" || p.side === "under" ? p.side : null;
    bet = side ? `<span class="${side === "over" ? "o" : "u"}">${side === "over" ? "Over" : "Under"} ${p.line}</span> Total Pts`
               : `<span class="o">${esc(p.title)}</span>`;
    rows.push(trow("chart", `Model: ${m.away} ${m.proj_away} – ${m.proj_home} ${m.home} · total ${m.proj_total}`, ""));
    rows.push(trow("target", `Model chance this hits`, p1(p.model_prob), pctCls(p.model_prob)));
    rows.push(trow("shield", `Model vs ${p.kind === "ml" ? "book price" : "line"}`, esc(p.model_edge_txt), p.model_edge > 0 ? "hi" : "lo"));
  }
  if (mode !== "cheat" && p.ev_pct != null) {
    const tier = p.tier === "prime" ? `<span class="tier prime" title="Pinnacle and the other book both say this price is good">2 SOURCES</span>` : "";
    const lane = p.lane_status === "testing" ? `<span class="tier test" title="This market hasn't passed the promotion gate yet, so stakes are halved">TESTING</span>` : "";
    rows.push(trow("dollar", `EV <b>${pct(p.ev_pct)}</b> vs ${esc(p.fair_source || "Pinnacle")} fair ${p1(p.fair_prob)}${tier}${lane}<br><span class="sub">needs ${pct(p.min_ev, 1)} at these odds</span>`, "", "", "ev"));
  }
  if (mode !== "cheat") {
    const u = p.units ? `${p.units}u${unitUsd() ? " · " + usd(p.units) : ""}` : "–";
    const why = p.sizing && p.sizing.conf_why && p.sizing.conf_why.length ? p.sizing.conf_why.join(", ") : "";
    const shared = p.sizing && (p.sizing.game_bets > 1 || p.sizing.player_bets > 1) ? `shared with ${p.sizing.game_bets - 1} other bet${p.sizing.game_bets > 2 ? "s" : ""} in this game` : "";
    const sub = [why, shared].filter(Boolean).length ? `<br><span class="sub">${esc([why, shared].filter(Boolean).join(" · "))}</span>` : "";
    const warn = p.unit_note ? `<br><span class="note-amber">${esc(p.unit_note)}</span>` : "";
    rows.push(trow("stack", `Recommended units${sub}${warn}`, u, "", "urow"));
  }
  return `<div class="tc ${inDetail ? "snap" : ""} ${fav ? "fav" : ""}" ${inDetail ? "" : `data-i="${i}"`}>
    <div class="th">${logoImg(team)}
      <div class="tm"><div class="tn">${name}${p.injury_status ? `<span class="inj">${esc(p.injury_status[0])}</span>` : ""}${fav ? '<span class="fav-b">👍 FAV</span>' : ""}</div><div class="tb">${bet}</div>
        <div class="sub">${when(p.kickoff)}${p.capped && p.units ? " · game cap" : ""}${p.injury_status ? ` · <span style="color:var(--amber)">${esc(p.injury_status)}${p.injury ? " (" + esc(p.injury) + ")" : ""}: check status before betting</span>` : ""}</div></div>
      <div class="tp"><div class="odds">${am(p.american)}</div><span class="bk ${esc(p.book)}">${p.book === "draftkings" ? "DK" : p.book === "fanduel" ? "FD" : esc(p.book)}</span></div>
    </div>
    ${rows.filter(Boolean).join("")}
    ${mode !== "cheat" ? `<button class="addbtn ${isMine(p) ? "on" : ""}" data-add="${inDetail ? "detail" : i}">${isMine(p) ? "✓ In My Results" : "＋ Add to My Results"}</button>` : ""}
  </div>`;
}

function banner(){
  const d = S.data, st = d.status || {};
  const parts = [];
  if (d.odds_as_of) parts.push(`Odds updated <b>${ago(d.odds_as_of)}</b>`);
  if (st.pinnacle_as_of && st.odds_checked) parts.push(`Pinnacle prices from <b>${ago(st.pinnacle_as_of)}</b>`);
  if (!st.odds_checked && d.next_kickoff) parts.push(`Odds checks start 4h before ${SP().kick} (next: <b>${when(d.next_kickoff)}</b>)`);
  const errs = [st.book_error && "DK/FD feed: " + st.book_error, st.pinnacle_error && "Pinnacle feed: " + st.pinnacle_error,
    st.pinnacle_stale && "Pinnacle: " + st.pinnacle_stale].filter(Boolean);
  const age = d.generated_at ? (Date.now() - new Date(d.generated_at)) / 60000 : 0;
  const soon = d.next_kickoff && (new Date(d.next_kickoff) - Date.now()) / 3600000 < 4;
  if (st.odds_checked && soon && age > 25) errs.unshift(`⚠️ This data is ${Math.round(age)} min old. Prices may have moved: re-check the price in the book before betting.`);
  return `<div class="banner">${parts.join(" · ") || "Waiting for first odds check"}</div>` +
    (errs.length ? `<div class="banner warn">${errs.map(esc).join("<br>")}</div>` : "");
}

const RG = `<div class="rg">Bet only what you can afford to lose. Paper-trade a market before staking it.<br>Gambling problem? Call <a href="tel:18004264537">1-800-GAMBLER</a>.</div>`;
const INTRO = {
  combined: "Cheat-sheet plays that are also +EV against Pinnacle's fair line. The strictest list. Tap any bet to see the numbers behind it.",
  ev: "DraftKings/FanDuel prices that beat the sharp no-vig fair line by enough for their odds (about 1% on favorites, up to 8–10% on +400 and longer). Sorted by expected profit. Tap any bet for the math.",
  cheat: "Matchup plays: player projections from defense vs position, plus a team scoring model for moneyline, spread and total. Tracked at 1u flat in Results.",
};

function budgetBar(mode){
  const list = S.data[mode] || [];
  const total = list.reduce((t, p) => t + (p.units || 0), 0);
  const d = unitUsd();
  return `<div class="banner budget"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div><b>Today:</b> ${list.length} play${list.length === 1 ? "" : "s"} · ${+total.toFixed(2)}u${d ? " ($" + (total * d).toFixed(0) + ")" : ""}
        <div class="sub">1 unit = ${d ? "$" + d : "not set"} · sized by edge, confidence and correlation</div></div>
      <button class="chip" id="open-settings">⚙️ Unit</button></div></div>`;
}

function openSettings(){
  const d = unitUsd();
  $("#sheet").innerHTML = `<div class="grab"><div class="bar0"></div><button class="close" aria-label="Close">✕</button></div>
    <h2 style="margin-top:4px">Settings</h2>
    <div class="sec"><h3>Unit size</h3>
      <div class="calc note">How many dollars 1 unit is for you. Every bet shows units and dollars.</div>
      <label class="field">$ <input id="set-unit" type="number" inputmode="decimal" min="1" step="1" value="${d || ""}" placeholder="10"> per unit</label>
      <div class="presets">${[5, 10, 20, 25, 50, 100].map(v => `<button class="chip ${v === d ? "on" : ""}" data-unit="${v}">$${v}</button>`).join("")}</div>
    </div>
    <button class="bet" id="save-settings" style="width:100%;border:0;font-size:16px">Save</button>
    <div class="help" style="margin-top:10px">Saved on this device. These will move to your account once accounts are added.</div>${RG}`;

  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("open"); $("#shade").classList.add("open"); document.body.classList.add("lock");
  history.pushState({sheet:1}, "");
}

function renderList(mode){
  const pf = prefs();
  const all = applyBudget((S.data[mode] || []).slice().sort((a, b) => mode === "cheat" ? 0
      : ((b.exp_profit_units ?? b.ev_pct / 100 * b.units) - (a.exp_profit_units ?? a.ev_pct / 100 * a.units))), mode)
    .filter(p => (pf[p.pkey] || {}).v !== "down");
  const list = all.filter(matches);
  list.sort((a, b) => ((pf[b.pkey] || {}).v === "up") - ((pf[a.pkey] || {}).v === "up"));
  S.shown = list;
  let html = banner() + (mode !== "cheat" ? budgetBar(mode) : "") + `<div class="help">${INTRO[mode]}</div>` + filterBar();
  if (!list.length) {
    html += `<div class="empty"><b>No plays right now</b>${all.length ? "Nothing matches these filters." :
      mode === "cheat" ? "Lines aren't posted yet. Projections are below." : "Check back closer to " + SP().kick + "."}</div>`;
  } else {
    const funded = mode === "cheat" ? list : list.filter(p => p.units);
    const skipped = mode === "cheat" ? [] : list.filter(p => !p.units);
    const shown = S.showSkipped ? funded.concat(skipped) : funded;
    S.shown = shown;
    html += shown.map((p, i) => card(p, mode, i)).join("");
    if (skipped.length) html += `<button class="chip more-btn" id="toggle-skipped">${S.showSkipped ? "Hide" : "Show"} ${skipped.length} skipped play${skipped.length > 1 ? "s" : ""} (over budget or game limit)</button>`;
  }
  if (mode === "cheat") html += projTables();
  return html + RG;
}

function projTables(){
  const gm = (S.data.game_model || []).filter(m => S.game === "all" || m.game_id === S.game);
  const lineTypes = ["lines","ml","spread","total"];
  const showLines = S.type === "all" || lineTypes.includes(S.type);
  const showProps = !lineTypes.includes(S.type);
  S.gmShown = gm;
  let h = "";
  if (showLines && gm.length) {
    h += `<h2>Game projections</h2><div class="card" style="cursor:default"><table>
      <tr><th>Game</th><th class="num">Proj score</th><th class="num">Margin</th><th class="num">Total</th></tr>
      ${gm.map((m, i) => `<tr class="tap" data-gm="${i}"><td><b>${m.away} @ ${m.home}</b><div class="sub">${when(m.kickoff)}</div></td>
        <td class="num">${m.proj_away}–${m.proj_home}</td><td class="num">${m.proj_margin >= 0 ? m.home : m.away} by ${Math.abs(m.proj_margin)}</td>
        <td class="num">${m.proj_total}</td></tr>`).join("")}</table></div>`;
  }
  const pfm = prefs();
  const rows = (S.data.matchups || []).filter(r => (pfm[r.pkey] || {}).v !== "down").filter(r => (S.game === "all" || r.game_id === S.game) &&
      (S.type === "all" || S.type === "props" || r.stat === S.type));
  S.mShown = rows.slice(0, 50);
  if (showProps && rows.length) {
    h += `<h2>Biggest player matchups</h2><div class="card" style="cursor:default"><table>
      <tr><th>Player</th><th>Stat</th><th class="num">Avg→Proj</th><th class="num">Def</th></tr>
      ${S.mShown.map((r, i) => `<tr class="tap" data-m="${i}"><td><b>${esc(r.player)}</b>${r.injury_status ? `<span class="inj">${esc(r.injury_status[0])}</span>` : ""}<div class="sub">${esc(r.position)} · ${esc(r.team)} vs ${esc(r.opp)}</div></td>
        <td>${esc(r.stat_label)}</td><td class="num">${r.baseline}→<b>${r.projection}</b></td>
        <td class="num ${r.matchup_pct > 0 ? "good" : "bad"}">${pct(r.matchup_pct, 0)}</td></tr>`).join("")}</table></div>`;
  }
  return h;
}

/* ---------------- detail sheet ---------------- */
function bookTable(p){
  const rows = p.books || []; if (!rows.length) return "";
  const prop = isProp(p);
  const [la, lb] = prop || p.kind === "total" ? ["Over","Under"] : [p.home, p.away];
  const ga = prop ? "over" : "a", gb = prop ? "under" : "b";
  const body = rows.map(r => {
    let fair = "";
    if (r.book === "pinnacle" && r[ga] && r[gb]) {
      const ia = 1 / r[ga], ib = 1 / r[gb], s = ia + ib;
      fair = `<div class="sub">no-vig ${p1(ia / s)} / ${p1(ib / s)}</div>`;
    }
    const mine = r.book === p.book;
    return `<tr><td>${mine ? "<b>" : ""}${BOOK[r.book] || esc(r.book)}${mine ? " ✓</b>" : ""}${fair}</td>
      <td class="num">${am(toAm(r[ga]))}</td><td class="num">${am(toAm(r[gb]))}</td></tr>`;
  }).join("");
  const lineTxt = prop || p.kind === "total" ? p.line : p.kind === "spread" ? `${p.home} ${p.line > 0 ? "+" : ""}${p.line}` : "";
  return `<div class="sec"><h3>Prices${lineTxt !== "" && lineTxt != null ? " · line " + esc(lineTxt) : ""}</h3><table>
    <tr><th>Book</th><th class="num">${esc(la)}</th><th class="num">${esc(lb)}</th></tr>${body}</table></div>`;
}

function evSection(p){
  const st = S.data.settings || {};
  if (p.ev_pct == null) return `<div class="sec"><h3>EV</h3><div class="calc note">${p.stat === "anytime_td"
    ? "Pinnacle has no anytime-TD market. DraftKings TD prices are compared with FanDuel's; FanDuel TD prices have no sharp source to compare against."
    : "Pinnacle has no matching line on this bet, so there's no fair price to compare against."} No EV or unit sizing.</div></div>`;
  const b = p.dec - 1, bookP = 1 / p.dec, tp = p.trusted_prob ?? p.fair_prob, trust = p.edge_trust ?? 0.5;
  const full = (b * tp - (1 - tp)) / b * 100;
  const kf = p.dec >= 4 ? 0.10 : 0.25;
  const z = p.sizing || {base: p.units, conf: 1, corr: 1, game_bets: 1, player_bets: 1, raw: p.units, cap: 2, conf_why: []};
  const src = p.fair_source || "Pinnacle";
  const sus = p.unit_note ? `<span class="note" style="color:var(--amber)">EV over ${st.suspect_ev ?? 15}% is "too good to be true" territory: usually a stale or mismatched line. Held to ${st.suspect_units ?? 0.5}u. Check the price is still there.</span>` : "";
  const NAMES = {multiplicative:"Multiplicative", additive:"Additive", power:"Power", shin:"Shin"};
  const dv = p.devig_all && Object.keys(p.devig_all).length
    ? `<div class="dv">${Object.entries(p.devig_all).map(([k, v]) => `<span class="${k === p.fair_method ? "w" : ""}">${NAMES[k] || k}${k === p.fair_method ? " (used: worst)" : ""}</span><span class="${k === p.fair_method ? "w" : ""}">${p1(v)}</span>`).join("")}</div>`
    : `<span class="eq">${esc(src)} only posts "Yes" here, so we assume ${Math.round((st.td_vig ?? 0.08) * 100)}% vig on it: fair ${p1(p.fair_prob)}</span>`;
  const second = p.second_ev != null
    ? `<span class="eq">${BOOK[p.book === "draftkings" ? "fanduel" : "draftkings"]}'s own no-vig price: EV ${pct(p.second_ev, 1)} → ${p.tier === "prime" ? '<b class="good">agrees (2 sources)</b>' : '<b class="bad">disagrees</b>'}</span>`
    : `<span class="eq">No second source on this line → one sharp source only</span>`;
  const L = p.lane_info;
  const lane = `<span class="eq">${esc(p.lane || "")}: ${p.lane_status === "proven" ? '<b class="good">proven</b>' : '<b style="color:var(--amber)">testing</b>'}${L ? ` · ${L.graded} graded over ${L.days} days · EV vs close ${L.ev_vs_close == null ? "–" : pct(L.ev_vs_close, 1)} · ROI ${L.roi_pct == null ? "–" : pct(L.roi_pct, 1)}` : " · no graded bets yet"}</span>`;
  return `<div class="sec"><h3>EV &amp; recommended units</h3><div class="calc">
    <span class="note">1. ${esc(src)}'s price${p.pinnacle_line ? " (" + esc(p.pinnacle_line) + ")" : ""} with the vig removed, four ways. We bet off the least favorable one:</span>
    ${dv}
    <span class="note">2. Compare to the ${BOOK[p.book] || p.book} price (${am(p.american)} = ${p.dec} decimal):</span>
    <span class="eq">EV = ${p.fair_prob.toFixed(4)} × ${p.dec} − 1 = <b class="good">${pct(p.ev_pct, 2)}</b></span>
    <span class="note">3. Longer odds need more EV, because the fair price is less certain:</span>
    <span class="eq">Needed at ${am(p.american)}: ${pct(p.min_ev, 1)} → ${p.ev_pct >= p.min_ev ? '<b class="good">passes</b>' : '<b class="bad">fails</b>'}</span>
    <span class="note">4. Second opinion:</span>
    ${second}
    <span class="note">5. For sizing, only trust ${Math.round(trust * 100)}% of the gap between the fair price and this book:</span>
    <span class="eq">${p1(bookP)} + ${trust} × (${p1(p.fair_prob)} − ${p1(bookP)}) = ${p1(tp)}</span>
    <span class="note">6. ${kf === 0.25 ? "Quarter" : "Tenth"}-Kelly on that chance is the base stake${kf < 0.25 ? " (longshots get 0.10 Kelly)" : ""}:</span>
    <span class="eq">Kelly ${full.toFixed(2)}% × ${kf} = <b>${z.base}u</b> base</span>
    <span class="note">7. Confidence${z.conf_why && z.conf_why.length ? " (" + esc(z.conf_why.join(", ")) + ")" : ""}:</span>
    <span class="eq">× ${z.conf}${z.conf === 1 ? " (no adjustment)" : ""}</span>
    <span class="note">8. Market lane: a market gets full stakes only after 30+ graded bets over 15+ days, with EV vs the closing line of at least +1% and a positive ROI:</span>
    ${lane}
    <span class="note">9. Correlation: bets in the same game (or on the same player) win and lose together, so they share a stake:</span>
    <span class="eq">${z.game_bets} bet${z.game_bets > 1 ? "s" : ""} in this game${z.player_bets > 1 ? ", " + z.player_bets + " on this player" : ""} → × ${z.corr}</span>
    <span class="eq">${z.base} × ${z.conf} × ${z.corr} = ${z.raw}u${z.raw >= z.cap ? " (capped at " + z.cap + "u)" : ""} → <b class="good">${p.units}u recommended</b>${unitUsd() ? " = " + usd(p.units) : ""}</span>
    <span class="note">Rounded to 0.25u, never below 0.25u, so every +EV play still gets a bet.</span>
    ${sus}
  </div></div>`;
}

function propModelSection(p){
  if (p.projection == null) return `<div class="sec"><h3>Cheat sheet</h3><div class="calc note">Not enough recent games for this player, so there's no projection.</div></div>`;
  const w = S.data.settings?.matchup_weight ?? 0.5, n = S.data.settings?.baseline_games ?? 6;
  const f = p.matchup_factor ?? (1 + p.matchup_pct / 100);
  const lineBits = p.line != null ? `<span class="eq">vs line ${p.line}: ${pct(p.proj_edge_pct, 1)} · model chance of over ${p1(p.model_prob_over)}</span>` +
    (p.cheat_side ? `<b class="good">Cheat sheet likes the ${esc(p.cheat_side)}</b>` :
     `<span class="note">Not a cheat-sheet play: it needs the projection 8%+ past the line <i>and</i> a matchup ${S.sport === "nba" ? "8" : "10"}%+ in the same direction.</span>`) : "";
  return `<div class="sec"><h3>Cheat sheet math</h3><div class="calc">
    <span class="note">1. Player's average over his last ${Math.min(n, p.games || n)} games:</span>
    <span class="eq">${esc(p.stat_label)} avg = ${p.baseline}</span>
    <span class="note">2. What ${esc(p.opp)} allows per game to ${esc(posName(p.position))} vs the league:</span>
    <span class="eq">${esc(p.opp)} ${p.def_allowed} vs league ${p.league_avg} → <b class="${p.matchup_pct > 0 ? "good" : "bad"}">${pct(p.matchup_pct, 1)}</b> (rank ${p.def_rank ?? "–"}/${p.def_n || 32}, 1 = gives up the most)${S.data.settings?.dvp_label ? " · " + esc(S.data.settings.dvp_label) : ""}</span>
    <span class="note">3. Projection, trusting ${Math.round(w * 100)}% of the matchup effect (defense numbers are noisy):</span>
    <span class="eq">${p.baseline} × (1 + ${w} × ${(f - 1).toFixed(3)}) = <b>${p.projection}</b></span>
    ${lineBits}</div></div>`;
}

function gameLog(p){
  const log = p.log || []; if (!log.length) return "";
  const hasLine = p.line != null && p.side;
  const rows = log.slice().reverse().map(g => {
    const hit = hasLine ? sideWins(p, g.v) : null;
    return `<tr><td>${esc(logLbl(g))}</td><td>vs ${esc(g.opp)}</td>
      <td class="num"><b>${g.v}</b></td><td class="num ${hit == null ? "" : hit ? "good" : "bad"}">${hit == null ? "" : hit ? "✓" : "✗"}</td></tr>`;
  }).join("");
  return `<div class="sec"><h3>${esc(p.player)} · recent ${esc(p.stat_label)}</h3>${bars(p)}<table style="margin-top:8px">
    <tr><th>${S.sport === "nfl" ? "Week" : "Game"}</th><th>Opp</th><th class="num">${esc(p.stat_label)}</th><th class="num">${hasLine ? (p.side === "over" ? "O" : "U") + " " + p.line : ""}</th></tr>${rows}</table></div>`;
}

function defLog(p){
  const log = p.def_log || []; if (!log.length) return "";
  const lg = p.league_avg, max = Math.max(...log.map(g => g.v), lg * 1.3, 1);
  const soft = v => v > lg;      // allowed more than league avg = soft
  const b = log.map(g => `<div class="bar" style="height:${Math.max(g.v / max * 100, 4)}%;background:${soft(g.v) ? "var(--green)" : "var(--red)"};opacity:.85"></div>`).join("");
  const rows = log.slice().reverse().map(g => `<tr><td>${esc(logLbl(g))}</td>
      <td>vs ${esc(g.vs)}</td><td class="num"><b>${g.v}</b></td>
      <td class="num ${soft(g.v) ? "good" : "bad"}">${pct((g.v / lg - 1) * 100, 0)}</td></tr>`).join("");
  return `<div class="sec"><h3>${esc(p.opp)} defense · ${esc(p.stat_label)} allowed to ${esc(posName(p.position))}</h3>
    <div class="calc note">All ${esc(posName(p.position))} combined, per game. Green = gave up more than league avg (${lg}), red = less.
      Season avg <b style="color:var(--text)">${p.def_allowed}</b> · rank ${p.def_rank ?? "–"}/32 (1 = softest).</div>
    <div class="bars">${b}<div class="lineMark" style="bottom:${Math.min(lg / max * 100, 100)}%"></div></div>
    <div class="barlbl"><span>Last ${log.length} games</span><span>dashed = league avg</span></div>
    <table style="margin-top:8px"><tr><th>${S.sport === "nfl" ? "Week" : "Game"}</th><th>Opponent</th><th class="num">Allowed</th><th class="num">vs avg</th></tr>${rows}</table></div>`;
}

function gameModelSection(m, p){
  if (!m) return "";
  const st = S.data.settings || {};
  const w = st.game_weight ?? 0.6, hfa = st.home_field ?? 1.5;
  let read = "";
  if (p) {
    const what = p.kind === "ml" ? `Model win % ${p1(p.model_prob)} vs book ${p1(1 / p.dec)} (with vig)` :
      p.kind === "spread" ? `Projected margin vs this spread: ${esc(p.model_edge_txt)}` : `Projected total vs this line: ${esc(p.model_edge_txt)}`;
    read = `<span class="eq">${what} · model chance this hits ${p1(p.model_prob)}</span>` +
      (p.cheat_side ? `<b class="good">Cheat sheet likes this side</b>` :
       `<span class="note">Not a cheat-sheet play (needs 2.5+ pts on spreads, 3+ on totals, 5%+ on moneylines).</span>`);
  }
  return `<div class="sec"><h3>Team model</h3><div class="calc">
    <span class="note">Points per game this season (league avg ${m.league_avg}):</span>
    <span class="eq">${m.home}: scores ${m.home_pf}, allows ${m.home_pa} (${m.home_games} g)<br>${m.away}: scores ${m.away_pf}, allows ${m.away_pa} (${m.away_games} g)</span>
    <span class="note">Each team's points = league avg adjusted by its offense × the other defense, ${Math.round(w * 100)}% weight, plus ${hfa} pts home field:</span>
    <span class="eq">Projected: ${m.away} ${m.proj_away} – ${m.proj_home} ${m.home}<br>${m.proj_margin >= 0 ? m.home : m.away} by ${Math.abs(m.proj_margin)} · Total ${m.proj_total} · ${m.home} win ${p1(m.home_win_prob)}</span>
    ${read}</div></div>`;
}

function openDetail(p, opts = {}){
  S.detailPick = p;
  const prop = isProp(p);
  const head = `<div class="row" style="margin-bottom:10px">
      ${prop && p.headshot ? `<img class="avatar" src="${esc(p.headshot)}" alt="" onerror="this.style.visibility='hidden'">` : `<div class="avatar">${esc(prop ? p.position || "" : SP().name)}</div>`}
      <div class="who"><div class="name" style="white-space:normal">${esc(p.player)}</div>
      <div class="sub">${prop ? `${esc(p.position || "")} · ${esc(p.team || "")} vs ${esc(p.opp || "")} · ` : ""}${when(p.kickoff)}</div></div></div>`;
  let betBox = "";
  if (p.title) betBox = `<div class="sec"><div class="row" style="justify-content:space-between">
      <div><div class="sub">The bet</div><div style="font-weight:700;font-size:17px">${esc(p.title)}</div>
      <div class="sub">${BOOK[p.book] || esc(p.book)} · ${am(p.american)}</div></div>
      ${p.units && opts.mode !== "cheat" ? `<div class="units"><div class="u">${p.units}u</div><div class="ul">recommended</div></div>` : ""}</div>
      ${p.deep_link ? `<a class="bet" href="${esc(p.deep_link)}" target="_blank" rel="noopener">Open in ${BOOK[p.book] || "book"} ›</a>` : ""}</div>`;
  const snap = p.title ? card(p, opts.mode || "cheat", 0, true) : "";
  let body = head + betBox;
  if (opts.projOnly) body += gameLog(p) + defLog(p) + propModelSection(p);
  else if (opts.gameOnly) body += gameModelSection(p.game_model, null);
  else if (prop) body = snap + (p.deep_link ? `<a class="bet" style="margin:0 0 12px" href="${esc(p.deep_link)}" target="_blank" rel="noopener">Open in ${BOOK[p.book] || "book"} ›</a>` : "")
      + gameLog(p) + defLog(p) + (opts.mode !== "cheat" ? evSection(p) : "") + propModelSection(p) + bookTable(p);
  else body = snap + (p.deep_link ? `<a class="bet" style="margin:0 0 12px" href="${esc(p.deep_link)}" target="_blank" rel="noopener">Open in ${BOOK[p.book] || "book"} ›</a>` : "")
      + (opts.mode !== "cheat" ? evSection(p) : "") + gameModelSection(p.game_model, p) + bookTable(p);
  body += `<div class="help" style="margin-top:6px">Numbers are estimates, not guarantees. Paper-trade before betting real money.</div>`;
  $("#sheet").innerHTML = `<div class="grab"><div class="bar0"></div><button class="close" aria-label="Close">✕</button></div>${body}`;
  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("open"); $("#shade").classList.add("open"); document.body.classList.add("lock");
  history.pushState({sheet:1}, "");
}
function closeDetail(fromPop){
  if (!$("#sheet").classList.contains("open")) return;
  $("#sheet").classList.remove("open"); $("#shade").classList.remove("open"); document.body.classList.remove("lock");
  if (!fromPop) history.back();
  if (S.data && S.tab !== "results") render();
}
window.addEventListener("popstate", () => closeDetail(true));

/* ---------------- my results ---------------- */
function money(v){ return (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2).replace(/\.00$/, ""); }
function betProfit(b){
  const g = gradeOf(b); if (!g) return null;
  const stake = b.stake ?? (b.units * (unitUsd() || 0));
  return g.result === "win" ? stake * (b.dec - 1) : g.result === "loss" ? -stake : 0;
}
function renderMine(){
  const bets = myBets().sort((a, b) => new Date(b.kickoff) - new Date(a.kickoff));
  if (!bets.length) return `<div class="empty"><b>No bets saved yet</b>Tap <b>＋ Add to My Results</b> on any EV play to track it here. It grades itself after the game.</div>`;
  const settled = bets.filter(b => gradeOf(b)), pending = bets.filter(b => !gradeOf(b));
  const W = settled.filter(b => gradeOf(b).result === "win").length, L = settled.filter(b => gradeOf(b).result === "loss").length;
  const P = settled.length - W - L;
  const risked = settled.filter(b => ["win","loss"].includes(gradeOf(b).result)).reduce((t, b) => t + (b.stake ?? b.units * (unitUsd() || 0)), 0);
  const profit = settled.reduce((t, b) => t + (betProfit(b) || 0), 0);
  const atRisk = pending.reduce((t, b) => t + (b.stake ?? b.units * (unitUsd() || 0)), 0);
  const row = b => { const g = gradeOf(b), pr = betProfit(b);
    return `<div class="mb" data-mine="${b.id}"><div class="who"><div class="name" style="font-size:15px"><span class="sporttag">${SPORTS[b.sport || "nfl"].name}</span>${esc(b.kind === "prop" ? b.player + " · " : "")}${esc(b.title)}</div>
      <div class="sub">${BOOK[b.book] || esc(b.book)} ${am(b.american)} · ${b.stake != null ? money(b.stake) : b.units + "u"} · ${when(b.kickoff)}${g && g.actual != null ? " · actual " + esc(g.actual) : ""}</div></div>
      <div class="pl-amt ${pr > 0 ? "good" : pr < 0 ? "bad" : ""}">${pr == null ? "" : (pr > 0 ? "+" : "") + money(pr)}</div>
      <span class="res ${g ? g.result : "pending"}">${g ? g.result : "pending"}</span></div>`; };
  return `<div class="sumgrid">
      <div class="card sum" style="cursor:default"><h3>Profit</h3><div class="big ${profit > 0 ? "good" : profit < 0 ? "bad" : ""}">${(profit > 0 ? "+" : "") + money(profit)}</div><div class="sub">ROI ${risked ? pct(profit / risked * 100) : "–"}</div></div>
      <div class="card sum" style="cursor:default"><h3>Record</h3><div class="big">${W}-${L}${P ? "-" + P : ""}</div><div class="sub">${settled.length} settled</div></div>
      <div class="card sum" style="cursor:default"><h3>Pending</h3><div class="big">${pending.length}</div><div class="sub">${money(atRisk)} at risk</div></div></div>
    ${pending.length ? `<h2>Pending</h2>${pending.map(row).join("")}` : ""}
    ${settled.length ? `<h2>Settled</h2>${settled.map(row).join("")}` : ""}
    <div class="help" style="margin-top:12px">Tap a bet to change the stake or odds you actually got, or remove it. Saved on this device until accounts are added.</div>`;
}
function openMine(id){
  const b = myBets().find(x => x.id === id); if (!b) return;
  $("#sheet").innerHTML = `<div class="grab"><div class="bar0"></div><button class="close" aria-label="Close">✕</button></div>
    <div class="sec"><div class="sub">${BOOK[b.book] || esc(b.book)} · ${when(b.kickoff)}</div>
      <div style="font-weight:700;font-size:17px;margin-top:2px">${esc(b.kind === "prop" ? b.player + " · " : "")}${esc(b.title)}</div>
      <label class="field">Stake $ <input id="mb-stake" type="number" inputmode="decimal" step="0.5" value="${b.stake ?? ""}"></label>
      <label class="field">Odds <input id="mb-odds" type="number" inputmode="numeric" step="1" value="${b.american}"></label>
      <button class="bet" id="mb-save" data-id="${b.id}" style="width:100%;border:0;margin-top:14px">Save</button>
      <button class="chip" id="mb-del" data-id="${b.id}" style="width:100%;margin-top:10px;color:var(--red);padding:11px">Remove bet</button></div>`;
  $("#sheet").classList.add("open"); $("#shade").classList.add("open"); document.body.classList.add("lock");
  history.pushState({sheet:1}, "");
}

/* ---------------- results ---------------- */
function renderResults(){
  const R = S.results;
  if (!R) return `<div class="empty"><b>No results yet</b>Picks get graded the morning after games, once box scores are in.</div>`;
  const sbox = (k, label) => { const r = R[k] || {};
    return `<div class="card sum" style="cursor:default"><h3>${label}</h3>
      <div class="big ${r.profit_units > 0 ? "good" : r.profit_units < 0 ? "bad" : ""}">${r.profit_units == null ? "–" : (r.profit_units > 0 ? "+" : "") + r.profit_units + "u"}</div>
      <div class="sub">${r.wins || 0}-${r.losses || 0}${r.pushes ? "-" + r.pushes : ""}</div>
      <div class="sub">ROI ${r.roi_pct == null ? "–" : pct(r.roi_pct)}</div>
      <div class="sub">Beat close ${r.beat_close_pct == null ? "–" : r.beat_close_pct + "%"}</div>
      <div class="sub">Expected ${r.expected_units == null ? "–" : (r.expected_units > 0 ? "+" : "") + r.expected_units + "u"}</div></div>`; };
  const lanes = Object.entries(R.lanes || {}).sort((a, b) => b[1].graded - a[1].graded);
  const ck = v => v ? '<span class="good">✓</span>' : '<span class="dim">·</span>';
  const laneTable = lanes.length ? `<h2>Market lanes</h2><div class="help">A lane gets full stakes once it has 30+ graded bets over 15+ days, average EV vs the closing line of +1% or better, and a positive ROI. Until then its stakes are halved.</div>
    <div class="card" style="cursor:default;overflow-x:auto"><table><tr><th>Lane</th><th class="num">Bets</th><th class="num">EV vs close</th><th class="num">ROI</th><th class="num">Status</th></tr>
    ${lanes.map(([k, L]) => `<tr><td>${esc(k.split(":")[1].replace("_", " "))}<div class="sub">${L.days} day${L.days === 1 ? "" : "s"}${L.t_stat != null ? " · t " + L.t_stat : ""}</div></td>
      <td class="num">${L.graded}${ck(L.checks.bets)}</td><td class="num">${L.ev_vs_close == null ? "–" : pct(L.ev_vs_close, 1)}${ck(L.checks.ev_vs_close)}</td>
      <td class="num">${L.roi_pct == null ? "–" : pct(L.roi_pct, 1)}${ck(L.checks.roi)}</td>
      <td class="num ${L.status === "proven" ? "good" : ""}" style="${L.status === "proven" ? "" : "color:var(--amber)"}">${L.status}</td></tr>`).join("")}</table></div>` : "";
  const rows = (R.recent || []).filter(r => r.mode !== "cheat").slice(0, 100).map(r => `<tr><td>${esc(r.player)}<div class="sub">${r.mode === "combined" ? "EV+CS" : r.mode === "ev" ? "EV" : "CS"} · ${esc(r.title || ((r.side === "over" ? "O " : "U ") + r.line + " " + r.stat_label))}</div></td>
      <td class="num">${am(r.american)}<div class="sub">${r.units}u</div></td>
      <td class="num">${r.actual ?? ""}<div class="sub ${r.result === "win" ? "good" : r.result === "loss" ? "bad" : ""}">${r.result || "pending"}</div></td></tr>`).join("");
  return `<div class="help">App record: every EV play the app lists is logged at the price first seen and recommended units. <b>Beat close</b> is how often that price beat the final sharp fair line. CLV and ROI together, over a few hundred bets, show whether the edges are real.</div>
    <div class="sumgrid" style="grid-template-columns:repeat(2,1fr)">${sbox("combined","EV + Cheat Sheet")}${sbox("ev","EV")}</div>
    <div class="help"><b>Expected</b> is what the edges should have earned. Real profit swings around it; a gap over a few dozen bets is normal variance.</div>
    ${laneTable}
    <h2>Recent picks</h2><div class="card" style="cursor:default"><table><tr><th>Pick</th><th class="num">Price</th><th class="num">Result</th></tr>${rows}</table></div>
    ${RG}`;
}

document.addEventListener("click", e => {
  if (e.target.closest("#open-menu")) { openMenu(); return; }
  if (e.target === $("#dshade")) { closeMenu(); return; }
  const spb = e.target.closest("[data-sport]");
  if (spb) { setSport(spb.dataset.sport); return; }
  if (e.target.closest("#open-settings3")) { closeMenu(); openSettings(); return; }
  if (e.target.closest(".close") || e.target === $("#shade")) { closeDetail(); return; }
  const t = e.target.closest(".tab");
  if (t) { document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t)); S.tab = t.dataset.t; render(); window.scrollTo(0,0); return; }
  const ab = e.target.closest(".addbtn");
  if (ab) {
    const p = ab.dataset.add === "detail" ? S.detailPick : S.shown[+ab.dataset.add];
    if (p) { toggleMine(p); const on = isMine(p);
      ab.classList.toggle("on", on); ab.textContent = on ? "✓ In My Results" : "＋ Add to My Results";
      $("#n-mine").textContent = myBets().filter(b => !gradeOf(b)).length || ""; }
    return;
  }
  const mb = e.target.closest(".mb[data-mine]");
  if (mb) { openMine(+mb.dataset.mine); return; }
  if (e.target.id === "mb-save" || e.target.id === "mb-del") {
    const id = +e.target.dataset.id, a = myBets(), i = a.findIndex(x => x.id === id);
    if (i >= 0) {
      if (e.target.id === "mb-del") a.splice(i, 1);
      else { const st = parseFloat($("#mb-stake").value), od = parseInt($("#mb-odds").value, 10);
        if (!isNaN(st)) a[i].stake = st;
        if (od && Math.abs(od) >= 100) { a[i].american = od; a[i].dec = od > 0 ? 1 + od / 100 : 1 + 100 / -od; } }
      saveMyBets(a);
    }
    closeDetail(); render(); return;
  }
  if (e.target.id === "open-settings" || e.target.id === "open-settings2") { openSettings(); return; }
  const pre = e.target.closest("[data-unit]");
  if (pre) { $("#set-unit").value = pre.dataset.unit; document.querySelectorAll("[data-unit]").forEach(x => x.classList.toggle("on", x === pre)); return; }
  if (e.target.id === "save-settings") {
    setNum(UNIT_KEY, parseFloat($("#set-unit").value) || 0);
    closeDetail(); render(); return;
  }
  if (e.target.id === "toggle-skipped") { S.showSkipped = !S.showSkipped; render(); return; }
  const c = e.target.closest(".tc[data-i]");
  if (c) { openDetail(S.shown[+c.dataset.i], {mode: S.tab}); return; }
  const m = e.target.closest("tr[data-m]");
  if (m) { openDetail(Object.assign({}, S.mShown[+m.dataset.m], {title: null, line: null, side: null}), {projOnly: true}); return; }
  const g = e.target.closest("tr[data-gm]");
  if (g) { const gm = S.gmShown[+g.dataset.gm]; openDetail({player: `${gm.away} @ ${gm.home}`, kind: "game", kickoff: gm.kickoff, game_model: gm}, {gameOnly: true}); }
});
document.addEventListener("change", e => {

  if (e.target.id === "f-game") S.game = e.target.value;
  if (e.target.id === "f-type") S.type = e.target.value;
  if (e.target.id === "f-book") S.book = e.target.value;
  render();
});
window.addEventListener("pageshow", e => { if (e.persisted && S.data) render(); });
load();
setInterval(() => { if (!$("#sheet").classList.contains("open")) load(); }, 120000);
</script>
</body>
</html>
